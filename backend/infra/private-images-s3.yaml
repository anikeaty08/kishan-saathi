AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 bucket for Kishan Saathi farmer-uploaded images

Parameters:
  BucketName:
    Type: String
    Description: Globally unique private bucket name

Resources:
  FarmerImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Product
          Value: kishan-saathi
        - Key: DataClassification
          Value: private-farmer-images

  FarmerImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FarmerImageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${FarmerImageBucket.Arn}"
              - !Sub "${FarmerImageBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  BucketName:
    Value: !Ref FarmerImageBucket
  BucketArn:
    Value: !GetAtt FarmerImageBucket.Arn
  ApplicationRolePolicy:
    Description: Add these actions to the backend workload role for the private prefix only
    Value: !Sub >-
      {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":"${FarmerImageBucket.Arn}/private/*"}]}

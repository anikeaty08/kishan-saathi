AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 bucket for Kishan Saathi farmer-uploaded images

Parameters:
  BucketName:
    Type: String
    Description: Globally unique private bucket name
  WorkloadServicePrincipal:
    Type: String
    Default: ecs-tasks.amazonaws.com
    AllowedValues:
      - ecs-tasks.amazonaws.com
      - tasks.apprunner.amazonaws.com
    Description: AWS service that assumes the backend image-access role

Resources:
  FarmerImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Product
          Value: kishan-saathi
        - Key: DataClassification
          Value: private-farmer-images

  FarmerImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FarmerImageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${FarmerImageBucket.Arn}"
              - !Sub "${FarmerImageBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  BackendImageWorkloadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Ref WorkloadServicePrincipal
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PrivateFarmerImageAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ObjectAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${FarmerImageBucket.Arn}/private/*"
              - Sid: BoundedBucketProbe
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FarmerImageBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "private/*"

Outputs:
  BucketName:
    Value: !Ref FarmerImageBucket
  BucketArn:
    Value: !GetAtt FarmerImageBucket.Arn
  BackendImageWorkloadRoleArn:
    Description: Least-privilege role for the backend compute service
    Value: !GetAtt BackendImageWorkloadRole.Arn
